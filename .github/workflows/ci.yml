name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scandihaven
          POSTGRES_PASSWORD: scandihaven
          POSTGRES_DB: scandihaven
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scandihaven"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://scandihaven:scandihaven@localhost:5432/scandihaven
      BETTER_AUTH_SECRET: ci-only-secret-value-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # DATABASE_URL is exported at job level (and passed through turbo
      # globalEnv), so the real-PG integration suites in `pnpm test` need the
      # schema in place first — migrate+seed MUST precede the test step.
      - name: Migrate + seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @scandihaven/web exec playwright install --with-deps chromium webkit

      - name: E2E (Chromium)
        run: pnpm --filter @scandihaven/web exec playwright test --project=chromium

      - name: Dependency audit (high+)
        # PR-blocking per PRD §12.1 — verified passing (1 moderate, 0 high).
        run: pnpm audit --audit-level high

      - name: Secret scan (dependency-free)
        # §13.3 job 6. Scans tracked files for common credential shapes
        # (including non-placeholder BETTER_AUTH_SECRET/CRON_SECRET
        # assignments; audit 2026-09-09 C2/H6d); `set-me` placeholders in
        # .env.example are the documented safe value. NOTE: `rg` exits 0 when
        # a match is FOUND, so a match must FAIL the step — the previous
        # `&& echo clean || exit 1` chaining inverted the gate (passed on
        # leaks, failed on clean repos). `--no-ignore` is load-bearing:
        # rg honors .gitignore, so tracked-but-ignored files (.env, .env.local
        # — the exact C2 shape re-exposed by 262d3cc) were invisible to this
        # gate without it (audit 2026-09-09 C-CI).
        run: |
          if rg -n --hidden --no-ignore --no-messages \
            -g '!.git/' -g '!node_modules/' -g '!.next/' -g '!.env.example' -g '!pnpm-lock.yaml' \
            -g '!skills/**' -g '!infrastructure/**' -g '!.github/workflows/ci.yml' \
            -g '!docs/audits/**' -g '!docs/ssh-key.txt' -g '!ssh-key.txt' -g '!**/ssh-key.txt' \
            -g '!.turbo/' -g '!coverage/' -g '!playwright-report/' -g '!test-results/' \
            -e 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            -e 'sk_(live|test)_[0-9a-zA-Z]{16,}' \
            -e 'rk_(live|test)_[0-9a-zA-Z]{16,}' \
            -e 'whsec_[0-9a-zA-Z]{16,}' \
            -e 're_[0-9a-zA-Z]{16,}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e '-----BEGIN' \
            -P -e 'BETTER_AUTH_SECRET=(?!set-me-with-openssl-rand-base64-32$)[A-Za-z0-9+/=]{32,}' \
            -P -e 'CRON_SECRET=(?!set-me-with-openssl-rand-hex-16$)[0-9a-f]{32,}' \
            . ; then
            echo '::error::potential secret committed'; exit 1
          else
            echo 'secret scan clean'
          fi
