services:
  db:
    image: postgres:17
    container_name: scandihaven-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scandihaven
      POSTGRES_PASSWORD: scandihaven
      POSTGRES_DB: scandihaven
      # locale/collation kept default for portability
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scandihaven -d scandihaven"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
